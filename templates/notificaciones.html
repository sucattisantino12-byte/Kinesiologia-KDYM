{% extends "base.html" %}
{% block title %}Notificaciones — KDYM{% endblock %}

{% block content %}
<div class="row" style="align-items:center; margin-bottom:14px;">
  <div class="grow">
    <div class="page-title" style="margin-bottom:2px;">Notificaciones</div>
    <div class="muted" id="notif-sub"></div>
  </div>
</div>

<div class="section-title">⚠️ Últimas sesiones — por renovar bono/autorización</div>
<div id="notif-alertas"></div>
{% endblock %}

{% block scripts %}
<script>
async function cargar() {
  const d = await apiGet('/api/notificaciones');
  const alertas = d.alertas || [];
  document.getElementById('notif-sub').textContent =
    alertas.length ? alertas.length + ' paciente(s) por renovar' : 'Todo al día 🙌';

  const ca = document.getElementById('notif-alertas');
  ca.innerHTML = alertas.length ? alertas.map(a => `
    <div class="card card-pad alerta-card notif-item">
      <div class="grow">
        <a href="/paciente/${a.paciente_id}" class="li-name">${escapeHtml(a.nombre_completo)}</a>
        <div class="li-sub">${a.obra_social ? escapeHtml(a.obra_social) + ' · ' : ''}<b>${a.quedan > 0 ? a.quedan + ' sesión(es) restante(s)' : 'sin sesiones'}</b></div>
      </div>
      <button class="x" onclick="cerrarAlerta(${a.paciente_id})" title="Cerrar">&times;</button>
    </div>`).join('') : '<div class="card"><div class="empty">No hay pacientes por renovar 🙌</div></div>';
}

async function cerrarAlerta(pid) { await api('/api/notificaciones/alerta/' + pid + '/cerrar'); cargar(); actualizarBadgeNotif(); }

cargar();
setInterval(cargar, 10000);
</script>
{% endblock %}
